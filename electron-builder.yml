appId: com.saulitoms.sonda
productName: Sonda
copyright: Copyright © 2026 Saul Sarabia
compression: maximum
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!.github/**'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*.map'
  - '!**/*.md'
  - '!**/{test,tests,__tests__}/**'
  - '!**/*.test.*'
  - '!out/cli/**'
asarUnpack:
  - resources/**
electronLanguages:
  - es
  - es_419
  - en-US
win:
  executableName: sonda
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Sonda guarda tus colecciones y entornos en la carpeta Documentos.
    - NSDownloadsFolderUsageDescription: Sonda puede guardar reportes y exportaciones en Descargas.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: SaulitoMS
  repo: sonda
  releaseType: release